# GEAR cold-start SFT with LLaMA-Factory.
# Run from a LLaMA-Factory checkout:
#   llamafactory-cli train /path/to/GEAR/SFT/configs/qwen2_vl_3b_full_sft.yaml

### model
model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full

### dataset
# Copy SFT/data/dataset_info.example.json to the LLaMA-Factory dataset_dir as
# dataset_info.json and replace the example file paths before training.
dataset: gear_solver_sft,gear_rubricator_sft
dataset_dir: /path/to/llamafactory_data
template: qwen2_vl
cutoff_len: 32768
overwrite_cache: true
preprocessing_num_workers: 8

### vision
image_max_pixels: 200704
image_min_pixels: 3136

### paper-style optimization
output_dir: outputs/gear_qwen25vl_3b_sft
num_train_epochs: 5
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 2.0e-5
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs: '{"min_lr": 2.0e-6}'
warmup_ratio: 0.01
weight_decay: 0.1
bf16: true
ddp_timeout: 180000000

### save and logging
save_strategy: steps
save_steps: 100
save_total_limit: 3
logging_steps: 10
report_to: tensorboard
run_name: gear_qwen25vl_3b_sft
plot_loss: true
